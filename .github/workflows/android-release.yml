name: Android Release Build

# TestDone — APK + AAB from source; signing GitHub Secrets se (keystore repo me NAHI hai).
# Secrets (one-time): repo Settings -> Secrets and variables -> Actions:
#   TD_KEYSTORE_BASE64 — keystore file ka base64 (base64 -w0 testdone-release.keystore)
#   TD_STORE_PASS / TD_KEY_ALIAS / TD_KEY_PASS
# Trigger:
#   - tag push (v2.3.18 ...) -> release ban jayegi: TestDone.apk + TestDone-<tag>-release.aab
#   - Actions tab -> "Android Release Build" -> Run workflow (main) -> sirf artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testdone-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          TD_KEYSTORE_BASE64: ${{ secrets.TD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$TD_KEYSTORE_BASE64" | base64 -d > keystore/testdone-release.keystore

      - name: Build release APK + AAB
        env:
          TD_STORE_PASS: ${{ secrets.TD_STORE_PASS }}
          TD_KEY_ALIAS: ${{ secrets.TD_KEY_ALIAS }}
          TD_KEY_PASS: ${{ secrets.TD_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestDone-APK
          path: testdone-native/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestDone-AAB
          path: testdone-native/app/build/outputs/bundle/release/app-release.aab

      # Tag builds: release with permanent naming — APK HAMESHA TestDone.apk
      # (link: .../releases/latest/download/TestDone.apk), AAB versioned naam se.
      - name: Rename outputs for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv app/build/outputs/apk/release/app-release.apk TestDone.apk
          mv app/build/outputs/bundle/release/app-release.aab "TestDone-${GITHUB_REF_NAME}-release.aab"

      - name: Create GitHub Release with APK + AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TestDone ${{ github.ref_name }}
          body: |
            Auto-build from tag ${{ github.ref_name }} (CI-signed with release keystore).
            - **TestDone.apk** — sideload install (same signing key as v2.3.14+)
            - AAB — Play Console upload ke liye
          files: |
            testdone-native/TestDone.apk
            testdone-native/TestDone-${{ github.ref_name }}-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
